<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team Gantt Chart</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="authGate">
    <div class="auth-card">
      <h1>Team Gantt Chart</h1>
      <p id="authMessage">Sign in with your Google account to continue.</p>
      <button id="signInBtn" type="button" class="google-btn" hidden>
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        Sign in with Google
      </button>
      <button id="signOutBtn" type="button" class="secondary-btn" hidden>Sign out</button>
    </div>
  </div>

  <div id="app" hidden>
    <header class="toolbar">
      <div class="toolbar-group">
        <button id="addGroupBtn" type="button">+ Group</button>
        <button id="addTaskBtn" type="button">+ Task</button>
      </div>
      <div class="toolbar-group toolbar-status">
        <span id="liveStatus" class="save-status" data-kind="live"></span>
      </div>
      <div class="toolbar-group">
        <button id="importBtn" type="button">Import JSON</button>
        <input id="importFileInput" type="file" accept="application/json" hidden />
        <button id="exportBtn" type="button">Export JSON</button>
        <button id="settingsBtn" type="button" title="Settings" aria-label="Settings">⚙</button>
        <span class="toolbar-sep"></span>
        <span class="user-badge">
          <img id="userAvatar" alt="" />
          <span id="userName"></span>
        </span>
        <button id="topSignOutBtn" type="button" title="Sign out" aria-label="Sign out">⎋</button>
      </div>
    </header>

    <div class="gantt-scroll" id="ganttScroll">
      <div class="gantt-content">
        <div class="header-row">
          <div class="corner-cell">Task</div>
          <div class="header-chart" id="headerChart"></div>
        </div>
        <div class="body-row">
          <div class="sidebar-col" id="sidebarCol"></div>
          <div class="chart-wrap">
            <div class="chart-col" id="chartCol"></div>
            <svg class="connectors" id="connectorsSvg"></svg>
          </div>
        </div>
      </div>
    </div>

    <div class="scrim" id="scrim" hidden></div>

    <aside class="panel" id="taskPanel" hidden aria-label="Task details">
      <div class="panel-header">
        <h2>Task details</h2>
        <button id="taskClose" type="button" class="panel-close" aria-label="Close">×</button>
      </div>
      <div class="panel-body">
        <label class="field">
          <span>Name</span>
          <input id="taskName" type="text" />
        </label>
        <label class="field">
          <span>Group</span>
          <select id="taskGroup"></select>
        </label>
        <label class="field">
          <span>Status</span>
          <select id="taskStatus"></select>
        </label>
        <div class="field-row">
          <label class="field">
            <span>Start</span>
            <input id="taskStart" type="date" />
          </label>
          <label class="field">
            <span>End</span>
            <input id="taskEnd" type="date" />
          </label>
        </div>
        <div class="field">
          <span>Assignees</span>
          <div id="taskAssignees" class="assignee-checks"></div>
        </div>
        <div class="field">
          <span>Depends on</span>
          <ul id="taskDepList" class="dep-list"></ul>
          <div class="dep-add-row">
            <select id="taskAddDepSelect"></select>
            <button id="taskAddDepBtn" type="button">Add</button>
          </div>
        </div>
        <p id="taskUpdatedHint" class="field-hint"></p>
        <button id="taskDelete" type="button" class="danger-btn">Delete Task</button>
      </div>
    </aside>

    <aside class="panel" id="settingsPanel" hidden aria-label="Settings">
      <div class="panel-header">
        <h2>Settings</h2>
        <button id="settingsClose" type="button" class="panel-close" aria-label="Close">×</button>
      </div>
      <div class="panel-body">
        <div class="field">
          <span>Team members</span>
          <div id="settingsAssignees" class="settings-assignee-list"></div>
          <p class="field-hint">Editing a name here relabels that assignee everywhere.</p>
        </div>
        <div class="field">
          <span>Signed in as</span>
          <p id="settingsSignedInAs" class="field-hint"></p>
          <button id="settingsSignOut" type="button" class="secondary-btn">Sign out</button>
        </div>
      </div>
    </aside>

    <div class="toast" id="toast" hidden></div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
